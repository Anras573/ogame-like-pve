# Local development dependencies. Run the API and web app from your machine (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ogame_pve
      POSTGRES_USER: ogame
      POSTGRES_PASSWORD: ogame # Development only
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogame -d ogame_pve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
